code: |-
  /* ===== PAGE BACKGROUND ===== */
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
    min-height: 100vh;
    color: #111827;
  }

  /* ===== MAIN WRAPPER ===== */
  .main-content,
  .layout-content,
  .region-content {
    display: block;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }

  /* ===== PROFILE CARD ===== */
  .node--type-web-developer,
  .node--view-mode-full,
  article.contextual-region {
    width: 100%;
    max-width: 1000px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
    padding: 0;
  }

  /* TOP BORDER EFFECT */
  .node--type-web-developer::before,
  .node--view-mode-full::before,
  article.contextual-region::before {
    content: "";
    display: block;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, #00c6ff, #7c3aed, #ec4899);
  }

  /* ===== CARD INNER AREA ===== */
  .node__content {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 30px;
    padding: 35px;
    align-items: start;
  }

  /* ===== LEFT SIDE PANEL ===== */
  .profile-sidebar {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 25px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }

  /* AUTHOR / DATE */
  .node__meta {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    color: #e5e7eb;
    padding: 10px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    font-size: 14px;
    font-weight: 500;
  }

  /* TITLE / NAME */
  .field--name-title,
  .field--name-field-name,
  .page-title {
    margin-bottom: 20px;
  }

  .field--name-title h2,
  .field--name-title h1,
  .page-title,
  .field--name-field-name {
    font-size: 38px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    margin: 0;
    letter-spacing: 0.5px;
  }

  /* SMALL LABEL STYLE */
  .profile-label,
  .field__label {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #dbeafe;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 12px;
    box-shadow: 0 8px 20px rgba(59,130,246,0.25);
  }

  /* ===== IMAGE SECTION ===== */
  .field--name-field-image,
  .field--name-field-profile-image {
    margin-bottom: 25px;
  }

  .field--name-field-image img,
  .field--name-field-profile-image img {
    width: 100%;
    max-width: 260px;
    display: block;
    border-radius: 22px;
    border: 4px solid rgba(255,255,255,0.25);
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    background: #fff;
    padding: 10px;
  }

  /* ===== RIGHT SIDE DETAILS ===== */
  .profile-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }

  /* INFO BOX */
  .profile-box,
  .field {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .profile-box:hover,
  .field:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 35px rgba(0,0,0,0.25);
  }

  /* BOX HEADING */
  .profile-box .field__label,
  .field .field__label {
    margin-bottom: 14px;
  }

  /* BOX VALUE */
  .profile-box .field__item,
  .field .field__item {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.6;
    word-break: break-word;
  }

  /* SKILLS TAGS */
  .field--name-field-skills .field__item,
  .field--name-field-skill .field__item {
    display: inline-block;
    margin: 6px 8px 0 0;
    padding: 10px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 8px 18px rgba(99,102,241,0.35);
  }

  /* EXPERIENCE / NUMBER BOX */
  .field--name-field-experience .field__item,
  .field--name-field-years-of-experience .field__item {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
  }

  /* BIO / DESCRIPTION FULL WIDTH */
  .field--name-body,
  .field--name-field-description,
  .field--name-field-about {
    grid-column: 1 / -1;
  }

  /* LINKS */
  a {
    color: #93c5fd;
    text-decoration: none;
  }

  a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .node__content {
      grid-template-columns: 1fr;
    }

    .profile-details {
      grid-template-columns: 1fr;
    }

    .field--name-title h1,
    .field--name-title h2,
    .page-title {
      font-size: 30px;
    }

    .field--name-field-image img,
    .field--name-field-profile-image img {
      max-width: 100%;
    }
  }

  @media (max-width: 600px) {
    .main-content,
    .layout-content,
    .region-content {
      padding: 20px 12px;
    }

    .node__content {
      padding: 20px;
      gap: 20px;
    }

    .profile-sidebar,
    .profile-box,
    .field {
      padding: 18px;
      border-radius: 18px;
    }

    .field--name-title h1,
    .field--name-title h2,
    .page-title {
      font-size: 24px;
    }
  }
media: all
