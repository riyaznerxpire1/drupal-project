id: studentsinfo
label: studentsinfo
code: |-
  (function (Drupal) {

    Drupal.behaviors.studentDownload = {
      attach: function (context, settings) {

        // Already button irundha duplicate varama prevent
        if (document.getElementById("downloadBtn")) return;

        function downloadStudentCSV() {

          const name = document.querySelector('.field--name-field-student-name .field__item')?.innerText || "";
          const email = document.querySelector('.field--name-field-email .field__item')?.innerText || "";
          const phone = document.querySelector('.field--name-field-p .field__item')?.innerText || "";
          const address = document.querySelector('.field--name-field-address .field__item')?.innerText || "";
          const dob = document.querySelector('.field--name-field-date-of-birth .field__item')?.innerText || "";
          const dept = document.querySelector('.field--name-field-department .field__item')?.innerText || "";

          const csvContent =
  `Name,Email,Phone,Address,DOB,Department
  ${name},${email},${phone},${address},${dob},${dept}`;

          const blob = new Blob([csvContent], { type: 'text/csv' });
          const url = window.URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = "student_info.csv";
          a.click();

          window.URL.revokeObjectURL(url);
        }

        // 🔘 Button create
        const btn = document.createElement("button");
        btn.id = "downloadBtn";
        btn.innerText = "Download Info";
        btn.style = "padding:10px 15px; background:#007bff; color:#fff; border:none; border-radius:5px; margin:10px; cursor:pointer;";

        btn.onclick = downloadStudentCSV;

        // 📍 Add to correct place
        const container = document.querySelector('.node__content');

        if (container) {
          container.prepend(btn);
        }

      }
    };

  })(Drupal);
